<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title description">
  <title id="title">Support-conditioned oracle calibration framework</title>
  <desc id="description">Three-panel schematic showing source-city training and model freezing, target-city baseline inference and oracle aggregate intervention, then inference-time bin calibration on the same known positive support.</desc>
  <defs>
    <style>
      .panel{fill:#fff;stroke:#4b5563;stroke-width:1.5}.header{fill:#243b53}.training{fill:#e8f1f8;stroke:#1f5f8b;stroke-width:1.5}.oracle{fill:#fdf0e4;stroke:#b45309;stroke-width:1.5}.output{fill:#e8f4ec;stroke:#2f855a;stroke-width:1.5}.neutral{fill:#f7f7f7;stroke:#5f6b76;stroke-width:1.25}.arrow{stroke:#1f5f8b;stroke-width:2;fill:none;marker-end:url(#arrowBlue)}.oracle-arrow{stroke:#b45309;stroke-width:2;fill:none;stroke-dasharray:8 5;marker-end:url(#arrowOrange)}.output-arrow{stroke:#2f855a;stroke-width:2;fill:none;marker-end:url(#arrowGreen)}.small{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#172b3a}.body{font-family:Helvetica,Arial,sans-serif;font-size:16px;fill:#172b3a}.paneltitle{font-family:Helvetica,Arial,sans-serif;font-size:18px;font-weight:bold;fill:#fff}.bold{font-weight:bold}.formula{font-family:Helvetica,Arial,sans-serif;font-size:14px;fill:#172b3a}.invariant{font-family:Helvetica,Arial,sans-serif;font-size:13px;fill:#1f4f38}
    </style>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1f5f8b"/></marker>
    <marker id="arrowOrange" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b45309"/></marker>
    <marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2f855a"/></marker>
  </defs>
  <rect width="1200" height="700" fill="#fafafa"/>
  <rect class="panel" x="24" y="30" width="355" height="625" rx="3"/><rect class="header" x="24" y="30" width="355" height="46" rx="3"/><text class="paneltitle" x="43" y="59">A. Cross-city model training</text>
  <rect class="training" x="63" y="102" width="275" height="67" rx="3"/><text class="body bold" x="201" y="128" text-anchor="middle">35 training cities + 5 validation cities</text><text class="small" x="201" y="151" text-anchor="middle">source-city positive OD intensities</text><path class="arrow" d="M201 169 L201 207"/>
  <rect class="training" x="63" y="212" width="275" height="84" rx="3"/><text class="body bold" x="201" y="240" text-anchor="middle">Cross-city inputs</text><text class="small" x="201" y="263" text-anchor="middle">tract features + spatial graph</text><text class="small" x="201" y="282" text-anchor="middle">+ pairwise distances</text><path class="arrow" d="M201 296 L201 334"/>
  <rect class="training" x="63" y="339" width="275" height="72" rx="3"/><text class="body bold" x="201" y="367" text-anchor="middle">Train and select model M0</text><text class="small" x="201" y="390" text-anchor="middle">cross-city learning only</text><path class="arrow" d="M201 411 L201 449"/>
  <rect class="neutral" x="63" y="454" width="275" height="62" rx="3"/><text class="body bold" x="201" y="482" text-anchor="middle">Freeze all model parameters</text><text class="small" x="201" y="504" text-anchor="middle">before target-city inference</text>
  <rect x="48" y="553" width="306" height="65" rx="3" fill="#fff7ed" stroke="#b45309" stroke-width="1.25"/><text class="small bold" x="201" y="580" text-anchor="middle">No target-city OD intensity</text><text class="small bold" x="201" y="602" text-anchor="middle">is used for model training</text>
  <rect class="panel" x="423" y="30" width="355" height="625" rx="3"/><rect class="header" x="423" y="30" width="355" height="46" rx="3"/><text class="paneltitle" x="442" y="59">B. Held-out target-city inference</text>
  <rect class="training" x="463" y="102" width="275" height="91" rx="3"/><text class="body bold" x="601" y="129" text-anchor="middle">Held-out target city</text><text class="small" x="601" y="151" text-anchor="middle">features + distances + known</text><text class="small" x="601" y="171" text-anchor="middle">positive support Ωc+</text><path class="arrow" d="M601 193 L601 227"/>
  <rect class="training" x="463" y="232" width="275" height="65" rx="3"/><text class="body bold" x="601" y="258" text-anchor="middle">Frozen M0</text><text class="small" x="601" y="280" text-anchor="middle">no fine-tuning or parameter update</text><path class="arrow" d="M601 297 L601 331"/>
  <rect class="training" x="463" y="336" width="275" height="59" rx="3"/><text class="body bold" x="601" y="371" text-anchor="middle">Baseline prediction T^(0)</text>
  <rect class="oracle" x="448" y="438" width="305" height="72" rx="3"/><text class="body bold" x="601" y="466" text-anchor="middle">Target positive ground-truth OD flows</text><text class="small" x="601" y="488" text-anchor="middle">same target reference flows used for evaluation</text><path class="oracle-arrow" d="M601 510 L601 539"/>
  <rect class="oracle" x="448" y="544" width="305" height="68" rx="3"/><text class="body bold" x="601" y="571" text-anchor="middle">Deterministic distance-bin aggregation</text><text class="small" x="601" y="593" text-anchor="middle">Y_D,c oracle</text><text class="small bold" x="601" y="638" text-anchor="middle" fill="#9a4d00">Dashed path: oracle intervention, not external telemetry</text>
  <rect class="panel" x="822" y="30" width="355" height="625" rx="3"/><rect class="header" x="822" y="30" width="355" height="46" rx="3"/><text class="paneltitle" x="841" y="59">C. Inference-time calibration</text>
  <rect class="neutral" x="862" y="102" width="275" height="66" rx="3"/><text class="body bold" x="999" y="129" text-anchor="middle">T^(0) + Y_D,c oracle</text><text class="small" x="999" y="151" text-anchor="middle">on the same known positive support Ωc+</text><path class="output-arrow" d="M999 168 L999 201"/>
  <rect class="output" x="847" y="206" width="305" height="101" rx="3"/><text class="body bold" x="999" y="233" text-anchor="middle">Compute bin-specific scaling</text><text class="formula" x="999" y="258" text-anchor="middle">w_c,b = p_c,b(cond) / Yhat_D,c,b(0)</text><text class="formula" x="999" y="280" text-anchor="middle">s_c,b = w_c,b / Sum_r Yhat_D,c,r(0) w_c,r</text><path class="output-arrow" d="M999 307 L999 339"/>
  <rect class="output" x="847" y="344" width="305" height="75" rx="3"/><text class="body bold" x="999" y="371" text-anchor="middle">Reallocate mass across distance bins</text><text class="formula" x="999" y="395" text-anchor="middle">T_hat_ij(1) = s_c,b(i,j) T_hat_ij(0)</text><path class="output-arrow" d="M999 419 L999 451"/>
  <rect class="output" x="847" y="456" width="305" height="65" rx="3"/><text class="body bold" x="999" y="483" text-anchor="middle">Calibrated prediction T^(1)</text><text class="small" x="999" y="505" text-anchor="middle">evaluate on the same Ωc+</text>
  <rect x="847" y="548" width="305" height="79" rx="3" fill="#edf7ef" stroke="#2f855a" stroke-width="1.25"/><text class="invariant bold" x="999" y="571" text-anchor="middle">Frozen model: no parameter update</text><text class="invariant bold" x="999" y="590" text-anchor="middle">Same support: no new OD links</text><text class="invariant bold" x="999" y="609" text-anchor="middle">Within-bin structure and total flow preserved</text>
</svg>